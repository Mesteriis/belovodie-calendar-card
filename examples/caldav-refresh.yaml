# Home Assistant's CalDAV integration discovers calendars during setup.
# Refresh the integration inventory so provider additions/removals reach /api/calendars.
- id: belovodie_calendar_caldav_inventory_refresh
  alias: Calendar — refresh CalDAV inventory
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/15"
  conditions:
    - condition: template
      value_template: "{{ integration_entities('caldav') | select('match', '^calendar\\.') | list | count > 0 }}"
  actions:
    - action: homeassistant.reload_config_entry
      target:
        entity_id: "{{ integration_entities('caldav') | select('match', '^calendar\\.') | list }}"
